# LLM matrix for the eval. `id` is the LiteLLM model string.
# input_price / output_price are USD per 1M tokens. Leave them out to let LiteLLM price the
# call; set them when LiteLLM does not know the model yet. Local models are free.
# `params` are passed straight to litellm.completion.
models:
  haiku:
    id: anthropic/claude-haiku-5-5
    concurrency: 8
  sonnet:
    id: anthropic/claude-sonnet-5-5
    concurrency: 4
  qwen3.5-9b:
    id: ollama_chat/qwen3.5:9b
    input_price: 0
    output_price: 0
    concurrency: 1    # one local GPU; parallel requests just queue
    params:
      think: false    # with thinking on, the reasoning trace eats the whole token budget
  gemma4-12b:
    id: ollama_chat/gemma4:12b
    input_price: 0
    output_price: 0
    concurrency: 1
    params:
      think: false
  # Same models through the Claude Code CLI on your own subscription login instead of an
  # API key (see README, "Running Claude on a subscription"). Usage counts against your
  # plan's limits; the reported cost is an estimate at API prices, not a bill.
  haiku-sub:
    id: claude-cli/haiku
    concurrency: 4
  sonnet-sub:
    id: claude-cli/sonnet
    concurrency: 2
