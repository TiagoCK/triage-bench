[project]
name = "triage-bench"
version = "0.1.0"
description = "An open, time-split benchmark and eval harness for GitHub issue triage (labeling and duplicate detection)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "scipy>=1.13",
]

[project.optional-dependencies]
# Dense retrieval and reranking. Pulls in torch, so CI skips it.
embed = ["sentence-transformers>=3.0"]
# LLM systems. 1.82.7 and 1.82.8 were backdoored on PyPI (March 2026); never allow them.
llm = ["litellm>=1.80,!=1.82.7,!=1.82.8"]

[project.scripts]
triage = "triage.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
