name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (base deps only; no torch, no LiteLLM)
        run: uv sync --locked
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test
      - name: Smoke eval + regression gate
        run: make smoke

  service:
    # The live service's tests, against a real Postgres (with pgvector, as in docker-compose).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: triage
          POSTGRES_PASSWORD: triage
          POSTGRES_DB: triage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triage"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TRIAGE_TEST_DATABASE_URL: postgresql://triage:triage@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (base + service extra)
        run: uv sync --locked --extra service
      - name: Service tests
        run: uv run pytest -q tests/service
      - name: Image builds
        run: docker build -t triage-bench-service .
